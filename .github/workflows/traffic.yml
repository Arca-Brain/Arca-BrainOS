name: Repository Traffic

on:
  schedule:
    - cron: "0 2 * * *" # S'exécute chaque nuit à 02h00 UTC
  workflow_dispatch: # Permet de déclencher l'action manuellement à tout moment

jobs:
  traffic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout traffic branch
        uses: actions/checkout@v4
        with:
          ref: "traffic"
          token: ${{ secrets.TRAFFIC_ACTION_TOKEN }}

      - name: Archive Repository Traffic
        uses: sangonzal/repository-traffic-action@v.0.1.6
        env:
          TRAFFIC_ACTION_TOKEN: ${{ secrets.TRAFFIC_ACTION_TOKEN }}

      - name: Commit and push traffic data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add traffic/
          git commit -m "chore(traffic): update repository traffic stats [skip ci]" || echo "No changes to commit"
          git push origin traffic
